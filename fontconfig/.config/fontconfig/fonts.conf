<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  Fallback fonts preference order
  <alias>
    <family>monospace</family>
    <prefer>
      <family>DejaVuSansM Nerd Font Mono</family>
      <family>UbuntuMono Nerd Font Mono</family>
      <family>AdwaitaMono Nerd Font</family>
      <family>NotoSansM Nerd Font Mono</family>
      <family>LiterationMono Nerd Font</family>
      <family>SauceCodePro Nerd Font Mono</family>
    </prefer>
  </alias>
</fontconfig>
